[board_pins mellow-fly-sb2040-v2]
mcu: toolhead
aliases:
    # LEDs
    RGB=gpio12,
    STATUS=gpio24,

    # Limit Switches
    ENDSTOP0=gpio28,
    ENDSTOP1=gpio29,
    ENDSTOP2=gpio25,

    # Extruder Stepper
    E0_STEP=gpio9, E0_DIR=gpio10, E0_ENABLE=gpio7, E0_CS=gpio11,  E0_PDN=gpio8,
    
    HEAT_0=gpio6,
    TEMP_0=gpio27,
    NTC=gpio26,

    # Fans
    FAN0=gpio13, FAN1=gpio14, FAN2=gpio15,
    PWM0=gpio16, PWM1=gpio17,

    # CANBus
    CAN_RX=gpio4, CAN_TX=gpio5,

    # SPI1 (ADXL345)
    ADXL_CS=gpio1, ADXL_SCK=gpio0, ADXL_MISO=gpio2, ADXL_MOSI=gpio3,

    # sSPI (MAX31865; if populated)
    MAXSPI_CS=gpio22, MAXSPI_SCK=gpio18, MAXSPI_MISO=gpio23, MAXSPI_MOSI=gpio19

