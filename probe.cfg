####################################################################
#  Probe
#####################################################################

[probe]
## Tap Probe
pin: toolhead: ENDSTOP0
x_offset: 0
y_offset: 0
#z_offset: 0.5
speed: 2.5
lift_speed: 15
samples: 1 #3
samples_result: median
sample_retract_dist: 1.5
#samples_tolerance: 0.005
samples_tolerance_retries: 10 #1
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}


[settling_probe]
settling_sample: true

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
points:
   25,25
   25,325
   325,325
   325,25
speed: 1000
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.01
max_adjust: 10


#####################################################################
#  Menu
#####################################################################
[menu __main __control __qgl]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: QGL
index: 3
gcode: QUAD_GANTRY_LEVEL


#####################################################################
#  Macros
#####################################################################
## customize QUAD GANTRY LEVEL gcode
[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
variable_done: False
description: Conform a moving, twistable gantry to the shape of a stationary bed
gcode:
  # If QGL is not applied, first run a course calibration
  {% if printer.quad_gantry_level.applied == False %}
    SMARTHOME
    G90
    status_leveling
    _SET_Z_CURRENT VAL='HOME'
    _QUAD_GANTRY_LEVEL RETRY_TOLERANCE=1.0 PROBE_SPEED=5
    #  _QUAD_GANTRY_LEVEL MAX_ADJUST=20 HORIZONTAL_MOVE_Z=20 RETRIES=0 SAMPLES=1 SPEED=1500   ; fast qgl
  {% endif %}

  status_leveling
  _SET_Z_CURRENT VAL='HOME'

  # then perform fine QGL down to desired spec
  # this has to be a separate macro call so the results of the above call will be visible!
  _FINE_QUAD_GANTRY_LEVEL

  G28 Z
  _SET_Z_CURRENT

[gcode_macro _FINE_QUAD_GANTRY_LEVEL]
gcode:
    {% if printer.quad_gantry_level.applied == True %}
        # go for full quality at reduced probing height
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=1.5
    {% else %}
        # This should never happen, just perform the full calibration using the defaults
        {action_respond_info("Fine QGL called without calling course QGL first!")}
        _QUAD_GANTRY_LEVEL  # default behavior, no speedup
    {% endif %}

[gcode_macro QGL]
gcode:
   QUAD_GANTRY_LEVEL

[gcode_macro SMARTQGL]
gcode:
  {% if not printer.quad_gantry_level.applied %}
      QUAD_GANTRY_LEVEL
  {% endif %}
